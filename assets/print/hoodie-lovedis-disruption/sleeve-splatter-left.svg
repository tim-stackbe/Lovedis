<?xml version="1.0" encoding="UTF-8"?>
<!-- Wearer LEFT sleeve (appears on viewer's RIGHT in front mockup photo) -->
<!-- Artboard 180mm x 270mm - orange Ben-Day halftone disc + blue splash with drips -->
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="270mm" viewBox="0 0 400 600">
  <title>Sleeve Splatter - Wearer Left</title>

  <defs>
    <pattern id="ht-orange-lg" patternUnits="userSpaceOnUse" width="16" height="16">
      <circle cx="8" cy="8" r="4.5" fill="#ff5736"/>
    </pattern>
    <pattern id="ht-orange-md" patternUnits="userSpaceOnUse" width="12" height="12">
      <circle cx="6" cy="6" r="3" fill="#ff5736"/>
    </pattern>
    <pattern id="ht-orange-sm" patternUnits="userSpaceOnUse" width="9" height="9">
      <circle cx="4.5" cy="4.5" r="2" fill="#ff5736" opacity="0.75"/>
    </pattern>
    <clipPath id="disc-clip">
      <circle cx="235" cy="115" r="88"/>
    </clipPath>
  </defs>

  <g clip-path="url(#disc-clip)">
    <rect x="140" y="20" width="190" height="190" fill="url(#ht-orange-lg)"/>
    <circle cx="235" cy="115" r="62" fill="url(#ht-orange-md)"/>
    <circle cx="235" cy="115" r="38" fill="url(#ht-orange-sm)"/>
  </g>

  <path fill="#2926e5"
    d="M105 195
       C55 155 70 95 115 65
       C165 30 240 55 275 105
       C305 148 285 215 235 255
       C195 285 140 275 105 195 Z"/>
  <path fill="#2926e5" opacity="0.9"
    d="M145 220
       C120 195 135 160 175 150
       C220 138 255 165 245 205
       C235 245 185 255 145 220 Z"/>

  <g fill="#2926e5">
    <rect x="168" y="268" width="10" height="115" rx="5"/>
    <rect x="205" y="258" width="8" height="135" rx="4"/>
    <rect x="242" y="275" width="7" height="105" rx="3.5"/>
    <rect x="128" y="285" width="6" height="88" rx="3"/>
    <path d="M218 395 Q224 445 216 495 Q212 535 220 575"
      fill="none" stroke="#2926e5" stroke-width="9" stroke-linecap="round"/>
    <circle cx="220" cy="580" r="10"/>
    <circle cx="198" cy="388" r="7"/>
  </g>

  <g fill="#2926e5">
    <circle cx="82" cy="215" r="7"/>
    <circle cx="295" cy="195" r="5"/>
    <circle cx="108" cy="325" r="4"/>
    <circle cx="318" cy="268" r="4"/>
  </g>
  <g fill="#ff5736">
    <circle cx="315" cy="135" r="5"/>
    <circle cx="148" cy="105" r="4"/>
  </g>
  <g fill="#0a0a0f" opacity="0.55">
    <circle cx="268" cy="315" r="3.5"/>
    <circle cx="95" cy="268" r="2.5"/>
    <circle cx="330" cy="245" r="3"/>
  </g>
</svg>
