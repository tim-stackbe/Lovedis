# Deploy platform to Hetzner TEST (49.13.222.76).
# Requires repo secrets: SSH_HOST, SSH_USER, SSH_KEY
name: Deploy TEST (Hetzner)

on:
  workflow_dispatch:
  push:
    branches: [Dedalus]

jobs:
  build-and-deploy-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tim-stackbe/lovedis:test
            ghcr.io/tim-stackbe/lovedis:${{ github.sha }}

      - name: Deploy to TEST server over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            if [ -d /opt/lovedis/deploy/hetzner ]; then
              cd /opt/lovedis/deploy/hetzner
            else
              cd /opt/lovedis
            fi
            docker compose pull platform || true
            docker compose up -d platform
            bash ./migrate.sh || true
            # Schema sync (project uses db push — no migrations folder)
            set -a; source ./.env; set +a
            DB_CID="$(docker compose ps -q db)"
            NETWORK="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$DB_CID" | head -1)"
            docker run --rm \
              --network "$NETWORK" \
              -e DATABASE_URL \
              -v /opt/lovedis:/app \
              -w /app \
              node:22-bookworm-slim \
              bash -lc '
                set -euo pipefail
                apt-get update -qq
                apt-get install -y -qq openssl ca-certificates >/dev/null
                npm ci --ignore-scripts
                npx prisma db push
              '

      - name: Post-deploy smoke test
        run: |
          chmod +x deploy/hetzner/smoke-test.sh
          deploy/hetzner/smoke-test.sh 49.13.222.76
