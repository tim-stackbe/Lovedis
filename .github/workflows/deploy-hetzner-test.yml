# Deploy platform to Hetzner TEST (49.13.222.76).
#
# Mac-local deploy is preferred — run from repo root on your Mac:
#   ./deploy/hetzner/deploy-platform.sh
#
# This workflow builds/pushes the :test image and can deploy via SSH only when
# repo secrets are configured: SSH_HOST, SSH_USER, SSH_KEY.
# Automatic deploy on push is disabled until secrets exist.
name: Deploy TEST (Hetzner)

on:
  workflow_dispatch:

jobs:
  build-and-deploy-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tim-stackbe/lovedis:test
            ghcr.io/tim-stackbe/lovedis:${{ github.sha }}

      - name: Deploy to TEST server over SSH
        if: ${{ secrets.SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            if [ -d /opt/lovedis/deploy/hetzner ]; then
              cd /opt/lovedis/deploy/hetzner
            else
              cd /opt/lovedis
            fi
            docker compose pull platform
            docker compose up -d platform
            bash ./migrate-db-push.sh

      - name: Skip SSH deploy (no secrets)
        if: ${{ secrets.SSH_KEY == '' }}
        run: |
          echo "SSH_KEY not configured — skipping server deploy."
          echo "Run ./deploy/hetzner/deploy-platform.sh from your Mac instead."

      - name: Post-deploy smoke test
        run: |
          chmod +x deploy/hetzner/smoke-test.sh
          deploy/hetzner/smoke-test.sh 49.13.222.76
