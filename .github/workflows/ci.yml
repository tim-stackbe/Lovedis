name: CI

on:
  push:
    branches: [mara, main]
  pull_request:
    branches: [mara, main]

jobs:
  test:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest

    # Throwaway CI-only values. These are NOT the real project secrets — the
    # Postgres service below is a disposable container that lives only for the
    # duration of the job, so credentials and auth secrets are dummy literals.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lovedis_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lovedis_test
      NEXTAUTH_SECRET: ci-test-secret
      AUTH_SECRET: ci-test-secret
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lovedis_test
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync schema to the test database
        run: npx prisma db push

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
